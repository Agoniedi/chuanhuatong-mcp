name: kelivo-group-chat

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kelivo_group_chat
      POSTGRES_USER: kelivo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kelivo -d kelivo_group_chat"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kelivo:${POSTGRES_PASSWORD}@postgres:5432/kelivo_group_chat
      DATABASE_SSL: "0"
      DATABASE_POOL_SIZE: "10"
      RUN_MIGRATIONS: "1"
      SERVER_HOST: 0.0.0.0
      PORT: "18787"
      CORS_ALLOW_ORIGIN: https://mcp.lumenverba.cc
      MCP_ALLOWED_ORIGINS: ""
      MCP_RATE_LIMIT_PER_MINUTE: "300"
      PUBLIC_REGISTRATION: "1"
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:18787:18787"
    networks:
      - backend
      - edge
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
